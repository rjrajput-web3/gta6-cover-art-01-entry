<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast Cover Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">NC</span>
    <div>
      <h1>Neon Coast Cover Studio</h1>
      <p class="tagline">Build a sun-soaked game cover from your own photos.</p>
    </div>
  </div>
  <div class="history">
    <button type="button" id="undo-btn" disabled>Undo</button>
    <button type="button" id="redo-btn" disabled>Redo</button>
    <button type="button" id="surprise-btn" class="accent">Surprise me</button>
  </div>
</header>

<main class="workspace">
  <section class="stage" aria-label="Cover preview">
    <canvas id="poster" width="1080" height="1350"></canvas>
    <p class="hint">Click a panel to select it, then drag its photo to reframe.</p>
  </section>

  <aside class="controls">
    <section class="panel">
      <h2>Photos</h2>
      <div id="photo-strip" class="strip"></div>
      <label class="upload">
        <span>Add your own photos</span>
        <input type="file" id="photo-input" accept="image/*" multiple>
      </label>
    </section>

    <section class="panel">
      <h2>Layout</h2>
      <div id="layout-grid" class="chips"></div>
      <h2>Colour grade</h2>
      <div id="grade-grid" class="chips"></div>
    </section>

    <section class="panel">
      <h2>Words</h2>
      <label>Title <input type="text" id="caption" maxlength="40"></label>
      <label>Subtitle <input type="text" id="subtitle" maxlength="48"></label>
      <label>Quote <input type="text" id="quote" maxlength="64"></label>
      <label>Tags <span class="note">separated by |</span>
        <input type="text" id="tags" maxlength="80"></label>
    </section>

    <section class="panel">
      <h2 id="panel-label">Panel 1</h2>
      <label>Zoom
        <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
      </label>
      <div class="row">
        <button type="button" id="flip-btn">Flip photo</button>
        <button type="button" id="center-btn">Centre photo</button>
      </div>
    </section>

    <section class="panel">
      <h2>Export PNG</h2>
      <div class="row wrap">
        <button type="button" class="export-btn" data-w="1080" data-h="1080">1080 × 1080</button>
        <button type="button" class="export-btn" data-w="1080" data-h="1350">1080 × 1350</button>
        <button type="button" class="export-btn" data-w="1920" data-h="1080">1920 × 1080</button>
        <button type="button" id="export-all" class="accent">Export all</button>
      </div>
    </section>
  </aside>
</main>

<script type="module" src="src/cover.js"></script>
<script type="module" src="src/shots.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
