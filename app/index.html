<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VICE HEAT — Leonida Golden-Hour Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <header class="brand">
      <p class="brand-script">Leonida Nights</p>
      <h1>VICE HEAT</h1>
      <p class="tagline">Golden-Hour Cover Studio — angled collage panels, duotone grades, halation and print furniture. Fully offline.</p>
    </header>

    <div class="group">
      <label>Layout
        <select id="layout"></select>
      </label>
      <label>Grade
        <select id="grade"></select>
      </label>
      <label>Title look
        <select id="look"></select>
      </label>
    </div>

    <div class="group">
      <label>Title line 1 <input id="titleA" type="text" maxlength="14"></label>
      <label>Title line 2 <input id="titleB" type="text" maxlength="14"></label>
      <label>Script accent <input id="script" type="text" maxlength="30"></label>
      <label>Sub strip <input id="sub" type="text" maxlength="60"></label>
      <label>Cover quote <input id="quote" type="text" maxlength="70"></label>
      <label>Quote source <input id="source" type="text" maxlength="30"></label>
    </div>

    <div class="group sliders">
      <label>Film grain <input id="grain" type="range" min="0" max="1" step="0.05"></label>
      <label>Halation glow <input id="halation" type="range" min="0" max="1" step="0.05"></label>
      <label>Keyline width <input id="keyline" type="range" min="0" max="22" step="1"></label>
    </div>

    <div class="group">
      <p class="hint">Panel photos — click a chip, then drag the cover to pan it, scroll to zoom it.</p>
      <div id="panels" class="chips"></div>
      <label>Your photo <input id="upload" type="file" accept="image/*"></label>
    </div>

    <div class="actions">
      <button id="surprise" type="button">★ Surprise Me</button>
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
    </div>
    <div class="actions">
      <button id="export" type="button">Export PNG</button>
      <select id="size" aria-label="Export size">
        <option value="1">1080 × 1350</option>
        <option value="2">2160 × 2700 (print)</option>
        <option value="0.75">810 × 1013</option>
        <option value="0.5">540 × 675</option>
      </select>
    </div>
    <p id="status" role="status"></p>
  </section>
  <section class="stage">
    <canvas id="cover" width="1080" height="1350" aria-label="Your VICE HEAT cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
