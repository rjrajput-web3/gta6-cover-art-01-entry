<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Vice Cover Studio</h1>
    <p class="tagline">Your photo + a caption, turned into a Vice City poster cover. Pick a photo, choose a layout and grade, export a PNG.</p>

    <fieldset>
      <legend>Photo</legend>
      <label>Photo for the selected panel <input id="photo" type="file" accept="image/*"></label>
      <div class="row">
        <button id="fillAll" type="button">Fill all panels</button>
        <button id="useSamples" type="button">Use sample photos</button>
      </div>
      <div id="panels" class="chips" aria-label="Panels"></div>
      <p id="panelNote" class="note"></p>
      <label>Zoom <input id="zoom" type="range" min="50" max="300" value="100"> <span id="zoomVal">100%</span></label>
      <label>Fit
        <select id="fit">
          <option value="cover">Cover (fill panel)</option>
          <option value="contain">Contain (whole photo)</option>
        </select>
      </label>
      <label class="check"><input id="flip" type="checkbox"> Flip photo horizontally</label>
      <p class="note">Tip: drag the photo on the preview to reposition it inside its panel.</p>
    </fieldset>

    <fieldset>
      <legend>Layout &amp; grade</legend>
      <label>Layout <select id="layout"></select></label>
      <label>Colour grade <select id="grade"></select></label>
      <label>Grade intensity <input id="intensity" type="range" min="0" max="100" value="80"> <span id="intensityVal">80%</span></label>
      <label>Gutter colour <input id="gutterColor" type="color" value="#0d0714"></label>
      <label class="check"><input id="grain" type="checkbox" checked> Film grain</label>
      <label class="check"><input id="vignette" type="checkbox" checked> Vignette</label>
    </fieldset>

    <fieldset>
      <legend>Caption</legend>
      <label>Title <input id="title" type="text" maxlength="40" value="Sunset Heist"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="Vice City Nights"></label>
      <label>Position
        <select id="captionPos">
          <option value="bottom">Bottom</option>
          <option value="top">Top</option>
        </select>
      </label>
      <label>Title size <input id="captionSize" type="range" min="6" max="16" value="11"> <span id="captionSizeVal">11%</span></label>
    </fieldset>

    <fieldset>
      <legend>Export PNG</legend>
      <div class="row exports">
        <button type="button" data-export="1080x1080">1080 x 1080</button>
        <button type="button" data-export="1080x1350">1080 x 1350</button>
        <button type="button" data-export="1920x1080">1920 x 1080</button>
      </div>
    </fieldset>
    <p id="status" role="status"></p>
  </section>
  <section class="preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
